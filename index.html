<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsX AI - Live Forex & Gold Sentiment</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-slate-100 p-4 md:p-8 max-w-xl mx-auto font-sans">

    <!-- Header -->
    <header class="flex justify-between items-center mb-6 border-b border-gray-800 pb-4">
        <div>
            <div class="flex items-baseline gap-2">
                <h1 class="text-xl font-bold text-blue-500 tracking-wider">NEWSX <span class="text-white">AI</span></h1>
                <span class="text-[10px] text-gray-400 font-medium italic">by Faris</span>
            </div>
            <p class="text-xs text-gray-400">Analisis Impak Berita Real-Time</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="requestNotificationPermission()" class="text-[10px] bg-blue-600/30 border border-blue-500/40 text-blue-300 px-2 py-1 rounded-md hover:bg-blue-600/50">
                🔔 Notify
            </button>
            <span class="w-2.5 h-2.5 bg-green-500 rounded-full animate-ping"></span>
            <span class="text-xs text-green-400 font-semibold">LIVE</span>
        </div>
    </header>

    <!-- Kad Berita Utama -->
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-5 shadow-2xl space-y-5 mb-6">
        <div>
            <span id="news-impact" class="bg-red-500/10 text-red-400 text-[10px] font-bold px-2.5 py-1 rounded-full border border-red-500/20">
                HIGH IMPACT
            </span>
            
            <div class="flex flex-wrap items-baseline gap-2 mt-2">
                <h2 id="news-title" class="text-xl font-bold text-white">Memuatkan...</h2>
                <span id="event-datetime" class="text-xs font-semibold text-blue-400 bg-blue-500/10 border border-blue-500/20 px-2 py-0.5 rounded-md">
                    -
                </span>
            </div>
            
            <p id="news-time" class="text-[10px] text-gray-500 mt-1">Dikemas kini: -</p>
        </div>

        <!-- Bias & Signal Box -->
        <div class="grid grid-cols-2 gap-3 bg-gray-950 p-4 rounded-xl border border-gray-800/80">
            <div>
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">USD BIAS</p>
                <span id="usd-bias" class="text-base font-bold text-blue-400">-</span>
            </div>
            <div>
                <p class="text-[10px] text-gray-500 font-bold uppercase mb-1">XAUUSD SIGNAL</p>
                <span id="gold-signal" class="text-base font-bold text-emerald-400">-</span>
            </div>
        </div>

        <!-- Ulasan AI -->
        <div class="border-t border-gray-800/60 pt-4">
            <h3 class="text-xs font-bold text-blue-400 uppercase tracking-wider mb-2">Ulasan AI (Bahasa Melayu)</h3>
            <p id="recap-bm" class="text-xs text-gray-300 leading-relaxed bg-gray-800/40 p-3.5 rounded-xl border border-gray-800/50">
                Sedang mengambil data analisis...
            </p>
        </div>
    </div>

    <!-- Senarai Berita -->
    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Senarai Berita (Tekan Untuk Papar)</h3>
    <div id="events-container" class="space-y-3 mb-8">
        <p class="text-xs text-gray-500">Memuatkan senarai berita...</p>
    </div>

    <script>
        const BACKEND_URL = "https://news-gold-ai-backend.onrender.com";

        async function requestNotificationPermission() {
            if ("Notification" in window) {
                const permission = await Notification.requestPermission();
                if (permission === "granted") {
                    alert("Notifikasi berjaya diaktifkan!");
                } else {
                    alert("Sila benarkan notifikasi dalam tetapan iOS Safari.");
                }
            } else {
                alert("Peranti atau penyemak imbas ini tidak menyokong Web Push Notification.");
            }
        }

        async function fetchLiveData() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/live-news`);
                const data = await res.json();

                const active = data.activeEvent;
                document.getElementById('news-title').innerText = active.title;
                document.getElementById('event-datetime').innerText = active.eventDateTime || "";
                document.getElementById('news-impact').innerText = active.impact || "HIGH IMPACT";
                document.getElementById('news-time').innerText = "Dikemas kini: " + active.updatedTime;
                
                const usdElem = document.getElementById('usd-bias');
                usdElem.innerText = active.usdBias;
                usdElem.className = active.usdBias.includes("Bullish") ? "text-base font-bold text-blue-400" : "text-base font-bold text-red-400";

                const goldElem = document.getElementById('gold-signal');
                goldElem.innerText = active.goldSignal;
                goldElem.className = active.goldSignal.includes("BUY") ? "text-base font-bold text-emerald-400" : "text-base font-bold text-red-500";

                document.getElementById('recap-bm').innerText = active.recapBm;

                const container = document.getElementById('events-container');
                container.innerHTML = "";

                data.allEvents.forEach(item => {
                    const isSelected = item.id === active.id;
                    const card = document.createElement('div');
                    
                    card.className = `p-4 rounded-xl border flex items-center justify-between cursor-pointer transition ${
                        isSelected 
                        ? 'bg-blue-950/40 border-blue-500/50 shadow-lg' 
                        : 'bg-gray-900 border-gray-800 hover:border-gray-700'
                    }`;

                    card.onclick = () => selectNews(item.id);

                    const isBullish = item.usdBias.includes("Bullish");
                    const isBuyGold = item.goldSignal.includes("BUY");

                    card.innerHTML = `
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-gray-400">${item.eventDateTime.split('|')[0] || ''}</span>
                                <h4 class="font-bold text-white text-sm">${item.title}</h4>
                            </div>
                            <p class="text-[10px] ${item.impact.includes("HIGH") ? "text-red-400" : "text-amber-400"} mt-0.5">${item.impact} (USD)</p>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded ${isBullish ? "bg-blue-500/10 text-blue-400" : "bg-red-500/10 text-red-400"} block mb-0.5">${item.usdBias}</span>
                            <span class="text-[10px] font-bold ${isBuyGold ? "text-emerald-400" : "text-red-400"}">${item.goldSignal}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });

            } catch (err) {
                console.log("Menunggu sambungan server...");
            }
        }

        async function selectNews(id) {
            try {
                await fetch(`${BACKEND_URL}/api/select-news`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: id })
                });
                fetchLiveData();
            } catch (err) {
                console.log("Gagal menukar berita");
            }
        }

        fetchLiveData();
        setInterval(fetchLiveData, 5000);
    </script>
</body>
</html>
